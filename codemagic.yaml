# Codemagic CI for MSP MIU Capacitor iOS IPA builds.
#
# Setup (one-time in Codemagic):
# 1. Connect this GitHub repository to your Codemagic app.
# 2. Team settings → Integrations → App Store Connect: add an API key.
# 3. Replace `app_store_connect` below with your integration name.
# 4. App Store Connect → create app with bundle ID `tech.mspmiu`.
# 5. Start the workflow; download the IPA from Artifacts when the build finishes.
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-an-ionic-app/

workflows:
  msp-miu-ios-ipa:
    name: MSP MIU iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # Replace with the App Store Connect API key name from Codemagic Team integrations.
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tech.mspmiu
      vars:
        BUNDLE_ID: tech.mspmiu
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # Keep in sync with client/android/app/build.gradle and Xcode MARKETING_VERSION.
        MARKETING_VERSION: "1.0.1"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: Back-End
          include: true
        - pattern: main
          include: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web assets (Vite)
        script: |
          npm run build:client

      - name: Sync Capacitor iOS project
        script: |
          cd client
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd client/ios/App
          pod install

      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles

      - name: Set iOS marketing and build numbers
        script: |
          cd "$CM_BUILD_DIR/client/ios/App"
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/client/ios/App"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - client/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # Optional publishing (uncomment when ready):
