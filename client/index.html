<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep layout scale fixed so inputs don't trigger automatic zoom on some mobile browsers
      (Note: disabling user scaling has accessibility trade-offs; see README or ask if you want
      a solution that preserves pinch-to-zoom while still avoiding input auto-zoom) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>MSP Tech Club — MIU</title>
    <meta name="title" content="MSP Tech Club — MIU" />
    <meta name="description" content="MSP Tech Club at Misr International University (MIU). A student-led innovation community powered by Microsoft Learn Student Ambassadors. Join us to explore cutting-edge technologies, build real projects, and develop technical & leadership excellence." />
    <link rel="canonical" href="https://msp-miu.tech/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="keywords" content="MSP, Microsoft Student Partners, MIU, Misr International University, tech club, student club, technology, programming, software development, Microsoft, student ambassadors, Egypt" />

    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="distribution" content="global" />
    <meta name="rating" content="general" />
    
    <!-- Favicon - Set dynamically using R2 domain -->
    <script>
      (function() {
        const r2Domain = __R2_PUBLIC_DOMAIN__ || '';
        const faviconPath = '/Assets/msp-logo-favicon.png';
        const faviconUrl = r2Domain ? `${r2Domain.replace(/\/+$/, '')}${faviconPath}` : '/assets/msp-logo-favicon.png';
        
        // Create and set favicon links
        const setFavicon = (rel, sizes = '') => {
          const link = document.createElement('link');
          link.rel = rel;
          link.type = 'image/png';
          if (sizes) link.setAttribute('sizes', sizes);
          link.href = faviconUrl;
          document.head.appendChild(link);
        };
        
        setFavicon('icon', '32x32');
        setFavicon('icon', '16x16');
        setFavicon('apple-touch-icon', '180x180');
        setFavicon('shortcut icon');
        setFavicon('apple-touch-icon');
      })();
    </script>
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
